[project]
name = "deepseek-balance"
version = "0.1.0"
description = "A deepseek-balance project generated with genproj"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "mcp>=2.0"
]

[project.scripts]
deepseek-balance-mcp = "deepseek_balance.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
# The built frontend (web/dist) is copied next to this module by the image, so
# the wheel carries the screens and the runtime needs nothing else.
deepseek_balance = ["web/index.html", "web/assets/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
