# Generated by genproj. The pipeline itself is created during generation,
# together with its GitHub webhook — without that webhook a push triggers
# nothing at all, which is the failure mode to watch for.
#
# Which steps appear here is decided by the capabilities the project selects:
# the deployment capabilities contribute their deploy steps, gitguardian
# contributes the secret scan, lighthouse-ci the performance gate. The
# agent-side prerequisites for all of them are in .buildkite/README.md.

steps:
  - label: ":hammer: Build and test (python)"
    key: build
    agents:
      queue: mac-studio-linux
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-slim"
          # The fleet is Apple silicon. Without this, docker resolves a
          # multi-arch tag to linux/amd64 and runs the whole step emulated (with
          # a warning, and native modules built for the wrong architecture).
          platform: linux/arm64
          workdir: /workdir
    commands:
      - python -m pip install --no-cache-dir -e ".[dev]"
      - ruff check src tests
      - pytest -q

  - label: ":svelte: Build and test (frontend)"
    key: web
    agents:
      queue: mac-studio-linux
    plugins:
      - docker#v5.13.0:
          image: "mcr.microsoft.com/playwright:v1.65.0-noble"
          # Apple silicon fleet: without this the multi-arch tag resolves to
          # amd64 and the browser runs emulated.
          platform: linux/arm64
          workdir: /workdir
    commands:
      - cd web
      - npm ci --no-audit --no-fund
      - npm run lint
      - npm run build
      # The image ships the browser, but `npm ci` resolves @playwright/test to
      # a patch release of its own; a mismatch exits 1 without a word.
      - npx playwright install --with-deps chromium
      # --list proves the suite was collected before it runs, and --reporter=line
      # means a failure prints where it happened rather than as a bare exit code.
      - npx playwright test --list
      - npx playwright test --reporter=line

  - label: ":docker: Build and publish image (GHCR)"
    key: docker_publish
    depends_on:
      - build
    if: build.branch == "main"
    agents:
      queue: mac-studio-linux
    env:
      IMAGE: ghcr.io/nickbrett1/deepseek-balance
      CACHE_REF: ghcr.io/nickbrett1/deepseek-balance:buildcache
    commands:
      # Credentials are resolved from Doppler at runtime with the agent's
      # DOPPLER_TOKEN - the same channel ftn's secret scan uses. CircleCI supplied
      # them through its "context: common"; Buildkite has no equivalent,
      # and putting a registry token in the agent's environment hook would expose
      # it to every job on the fleet. The value is only ever in the job's shell.
      - |
        GHCR_USERNAME=nickbrett1
        GHCR_TOKEN="$$(curl -fsS -H "Authorization: Bearer $$DOPPLER_TOKEN" "https://api.doppler.com/v3/configs/config/secret?project=common&config=prd&name=GHCR_UPDATE_TOKEN" | sed -n 's/.*"raw"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
        if [ -z "$$GHCR_TOKEN" ]; then
          echo "GHCR_UPDATE_TOKEN is missing from Doppler (common/prd) - cannot publish." >&2
          exit 1
        fi
        echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
      - |
        BUILDX_BUILDER_NAME="bk-$$BUILDKITE_PIPELINE_SLUG-$$BUILDKITE_JOB_ID"
        trap 'docker buildx rm "$$BUILDX_BUILDER_NAME" >/dev/null 2>&1 || true' EXIT
        docker buildx create --bootstrap --name "$$BUILDX_BUILDER_NAME" >/dev/null
      - >
        docker buildx build --builder "$$BUILDX_BUILDER_NAME" --platform linux/amd64
        --cache-from type=registry,ref=$$CACHE_REF
        --cache-to type=registry,ref=$$CACHE_REF,mode=max
        -t $$IMAGE:$$BUILDKITE_COMMIT -t $$IMAGE:latest --push .
