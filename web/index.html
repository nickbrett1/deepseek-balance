<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>DeepSeek Balance</title>
    <!-- Dark from the first paint: the widget is iframed inside a dashboard, and
         a white flash there is a white flash in someone else's page. -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-title" content="DeepSeek" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque, not translucent. `black-translucent` is the value that invites
         the page to be drawn *under* the status bar, and that band is the one
         place a home-screen window can composite something over our own bar.
         `black` asks for a solid strip with the page starting below it, so the
         top of the UI is our CSS and nothing else. Costs a black strip above a
         dark navy one; a crisp top nav is worth more than a seamless seam. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <style>
      /* iOS standalone samples the top of the viewport and blurs what is under
         it, so an opaque bar is not enough on its own: WebKit looks for a fixed
         box at the top edge, at least 90% of the width, with a background
         thicker than 10px, and without one it blurs the content instead. This
         is that box -- empty, fixed, full width, 11px. `background-clip: text`
         clips its background to no text at all, so WebKit gets a colour to
         sample and nothing is painted over the controls.
         See ui-registry README, "The iOS top-edge surface". */
      .pwa-status-bar-surface {
        display: none;
      }
      @supports (-webkit-touch-callout: none) and (background-clip: text) {
        @media (display-mode: standalone) {
          .pwa-status-bar-surface {
            display: block;
            position: fixed;
            inset: 0 0 auto;
            /* 11px clears the 10px thin-border threshold; the inset is added
               because the band WebKit composites over is the safe area. */
            height: calc(11px + env(safe-area-inset-top, 0px));
            z-index: 100;
            pointer-events: none;
            background-color: inherit;
            -webkit-background-clip: text;
            background-clip: text;
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="pwa-status-bar-surface" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
